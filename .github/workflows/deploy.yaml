name: Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Verify runner & cluster
      run: |
        echo "Runner OK"
        kubectl config current-context
        kubectl get nodes

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -f k8s/

    - name: Force rollout (ensure new image is pulled)
      run: |
        kubectl rollout restart deployment backend-deployment

    - name: Verify deployment
      run: |
        kubectl get pods -o wide