name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to DockerHub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: |
          docker build --no-cache \
            -t aresden113/devops-backend:${{ env.IMAGE_TAG }} \
            ./app/server

      - name: Push Docker image
        run: |
          docker push aresden113/devops-backend:${{ env.IMAGE_TAG }}

      - name: Tag image as latest
        run: |
          docker tag \
            aresden113/devops-backend:${{ env.IMAGE_TAG }} \
            aresden113/devops-backend:latest

          docker push aresden113/devops-backend:latest

      - name: Update Kubernetes Manifest
        run: |
          sed -i "s|image: .*|image: aresden113/devops-backend:${{ env.IMAGE_TAG }}|g" k8s/backend-deployment.yaml

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add k8s/backend-deployment.yaml

          git commit -m "update image to ${{ env.IMAGE_TAG }}" || echo "No changes to commit"

          git push